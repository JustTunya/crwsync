services:
  postgres:
    image: postgres:16-alpine
    container_name: crwsync-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-crwsync}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crwsync}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crwsync_prod_net

  redis:
    image: redis:7-alpine
    container_name: crwsync-redis-prod
    restart: always
    command: >
      sh -c '
        if [ -n "$REDIS_PASS" ]; then
          redis-server --requirepass "$REDIS_PASS" --appendonly yes;
        else
          redis-server --appendonly yes;
        fi
      '
    environment:
      - REDIS_PASS=${REDIS_PASS:-}
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crwsync_prod_net

  minio:
    image: minio/minio:latest
    container_name: crwsync-minio-prod
    restart: always
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_prod:/data
    networks:
      - crwsync_prod_net

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: crwsync-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - APP_URL=${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-crwsync}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASS=${REDIS_PASS:-}
      - REDIS_DB=${REDIS_DB:-0}
      - JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET:-production-jwt-access-secret-minimum-32-chars}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION:-15m}
      - COOKIE_SECRET=${COOKIE_SECRET:-production-cookie-secret-random-32-chars}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET:-crwsync-uploads}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
    networks:
      - crwsync_prod_net

  web:
    build:
      context: .
      dockerfile: apps/frontend/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_DASH_URL: ${NEXT_PUBLIC_DASH_URL:-http://localhost:3001}
    container_name: crwsync-web-prod
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - crwsync_prod_net

  dash:
    build:
      context: .
      dockerfile: apps/frontend/dash/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
    container_name: crwsync-dash-prod
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - crwsync_prod_net

networks:
  crwsync_prod_net:
    driver: bridge

volumes:
  postgres_data_prod:
    name: crwsync-postgres-data-prod
  redis_data_prod:
    name: crwsync-redis-data-prod
  minio_data_prod:
    name: crwsync-minio-data-prod
