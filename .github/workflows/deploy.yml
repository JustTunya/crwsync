name: CRWSYNC deployment

on:
  push:
    branches: [main]

concurrency:
  group: 'crwsync'
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  packages: write
  id-token: write
  deployments: write

jobs:
  test:
    name: 🧪 Lint & Test (Node)
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
        run: pnpm --filter @crwsync/backend run prisma:generate

      - name: Build common package
        run: pnpm turbo run build --filter="@crwsync/types" --filter="@crwsync/styles"

      - name: Lint & Test project
        run: pnpm turbo run lint test

  lint-docker:
    name: 🐳 Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Hadolint
        run: |
          sudo curl -L -o /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Lint all Dockerfiles
        run: |
          hadolint apps/frontend/web/Dockerfile apps/frontend/dash/Dockerfile apps/backend/Dockerfile

  scan-security:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan codebase for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

  build:
    name: 🛠️ Build & Push ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [test, lint-docker, scan-security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            file: apps/frontend/web/Dockerfile
          - app: dash
            file: apps/frontend/dash/Dockerfile
          - app: backend
            file: apps/backend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ (matrix.app == 'web' || matrix.app == 'dash') && secrets.NEXT_PUBLIC_API_URL || '' }}
            NEXT_PUBLIC_DASH_URL=${{ matrix.app == 'web' && secrets.NEXT_PUBLIC_DASH_URL || '' }}
            NEXT_PUBLIC_WEB_URL=${{ matrix.app == 'dash' && secrets.NEXT_PUBLIC_WEB_URL || '' }}
            NEXT_PUBLIC_DEMO_IDENTIFIER=${{ matrix.app == 'web' && secrets.NEXT_PUBLIC_DEMO_IDENTIFIER || '' }}
            NEXT_PUBLIC_DEMO_PASSWORD=${{ matrix.app == 'web' && secrets.NEXT_PUBLIC_DEMO_PASSWORD || '' }}
          # Expose the database URL using build-time secure context isolation
          secrets: |
            ${{ matrix.app == 'backend' && format('DATABASE_URL={0}', secrets.DATABASE_URL) || '' }}
          tags: ghcr.io/${{ secrets.GH_REPO }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: 🚀 Deploy CRWSYNC stack
    runs-on: [ self-hosted, linux, x64 ]
    needs: build
    timeout-minutes: 10
    env:
      WEB_IMAGE: ghcr.io/${{ secrets.GH_REPO }}/web:${{ github.sha }}
      DASH_IMAGE: ghcr.io/${{ secrets.GH_REPO }}/dash:${{ github.sha }}
      BACKEND_IMAGE: ghcr.io/${{ secrets.GH_REPO }}/backend:${{ github.sha }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL }}
      NEXT_PUBLIC_DASH_URL: ${{ secrets.NEXT_PUBLIC_DASH_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRISMA_LOG_QUERY: ${{ secrets.PRISMA_LOG_QUERY }}
      REDIS_PASS: ${{ secrets.REDIS_PASS }}
      REDIS_KEY_PREFIX: ${{ secrets.REDIS_KEY_PREFIX }}
      MAIL_HOST: ${{ secrets.MAIL_HOST }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
      JWT_ACCESS_TOKEN_SECRET: ${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
      JWT_ACCESS_TOKEN_EXPIRATION: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
      ACCESS_COOKIE_DOMAIN: ${{ secrets.ACCESS_COOKIE_DOMAIN }}
      REFRESH_COOKIE_DOMAIN: ${{ secrets.REFRESH_COOKIE_DOMAIN }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine Swarm state
        id: swarm
        run: |
          echo "state=$(docker info --format '{{.Swarm.LocalNodeState}}')" >> $GITHUB_OUTPUT

      - name: Init Swarm if needed
        if: steps.swarm.outputs.state != 'active'
        run: docker swarm init --advertise-addr 127.0.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images (warm)
        run: |
          docker pull ${WEB_IMAGE} &
          docker pull ${DASH_IMAGE} &
          docker pull ${BACKEND_IMAGE} &
          wait

      - name: Run database migrations
        run: |
          docker run --rm \
            -e DATABASE_URL="${DATABASE_URL}" \
            -v ${{ github.workspace }}/apps/backend/prisma/migrations:/app/prisma/migrations \
            -w /app \
            ${BACKEND_IMAGE} /bin/sh -c '
            echo "Attempting to run database migrations..."
            OUTPUT=$(npx prisma migrate deploy --config prisma.config.ts 2>&1)
            STATUS=$?
            echo "$OUTPUT"
            
            if [ $STATUS -ne 0 ] && (echo "$OUTPUT" | grep -q "P3005" || echo "$OUTPUT" | grep -q "The database schema is not empty"); then
              echo "Warning: Database has existing tables but is untracked by Prisma (_prisma_migrations is missing)."
              echo "Dynamically resolving the baseline migration to establish tracking..."
              
              FIRST_PATH=$(ls -d prisma/migrations/*/ 2>/dev/null | head -n 1)
              if [ -z "$FIRST_PATH" ]; then
                echo "Error: No migrations found in prisma/migrations to baseline."
                exit 1
              fi
              
              FIRST_MIGRATION=${FIRST_PATH%/}
              FIRST_MIGRATION=${FIRST_MIGRATION##*/}
              echo "Earliest migration identified: $FIRST_MIGRATION"
              
              echo "Resolving baseline migration: $FIRST_MIGRATION"
              npx prisma migrate resolve --applied "$FIRST_MIGRATION" --config prisma.config.ts || exit $?
              
              echo "Retrying migration deployment..."
              npx prisma migrate deploy --config prisma.config.ts || exit $?
            elif [ $STATUS -ne 0 ]; then
              echo "Error: Migration failed with exit code $STATUS (not a P3005/untracked database error)."
              exit $STATUS
            else
              echo "Migrations applied successfully."
            fi
          '

      - name: Remove old stack if exists
        run: docker stack rm crwsync || true

      - name: Ensure network exists
        run: |
          docker network inspect crwsync_net >/dev/null 2>&1 || \
          docker network create --driver overlay --attachable crwsync_net

      - name: Deploy stack
        run: |
          docker stack deploy --with-registry-auth --detach=true -c stack.yml crwsync

      - name: Verify services
        run: docker service ls