name: Scheduled security audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: 🔍 pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run pnpm audit
        id: audit
        run: |
          pnpm audit --audit-level=high 2>&1 | tee audit-report.txt
          exit ${PIPESTATUS[0]}

      - name: File tracking issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const label = "dependency-audit";
            const report = fs.readFileSync("audit-report.txt", "utf8").slice(-60000);

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Audit still failing as of run ${context.runId}:\n\n\`\`\`\n${report}\n\`\`\``,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Scheduled pnpm audit found high/critical vulnerabilities",
              labels: [label],
              body: `The weekly [security audit workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) found dependency vulnerabilities at \`high\` severity or above.\n\n\`\`\`\n${report}\n\`\`\`\n\nRun \`pnpm audit\` locally, upgrade the flagged packages, and close this issue once the run is clean again.`,
            });
